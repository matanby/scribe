<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
  <style>
    :root { color-scheme: light dark; font: 16px/1.65 -apple-system, BlinkMacSystemFont, sans-serif; }
    body { margin: 0; padding: 32px 40px 60px; color: light-dark(#242424, #ececec); background: light-dark(#fff, #202020); }
    main { max-width: 850px; margin: auto; overflow-wrap: anywhere; }
    [dir] { text-align: start; }
    h1, h2, h3 { line-height: 1.3; margin-block: 1.3em .5em; }
    h1 { font-size: 2em; } h2 { font-size: 1.5em; } h3 { font-size: 1.2em; }
    p { margin-block: .65em; }
    ul, ol { padding-inline-start: 1.8em; padding-inline-end: 0; }
    li > p { margin-block: .2em; }
    li.task-list-item, li[data-type="taskItem"] { list-style: none; }
    input[type="checkbox"] { margin-inline: -1.5em .5em; vertical-align: middle; }
    li[data-type="taskItem"] { display: flex; gap: .5em; }
    li[data-type="taskItem"] > label { flex: 0 0 auto; }
    li[data-type="taskItem"] > label input { margin: 0; }
    li[data-type="taskItem"] > div { flex: 1; min-width: 0; }
    pre { direction: ltr; text-align: left; overflow: auto; padding: 14px; border-radius: 8px; background: light-dark(#f4f4f4, #2b2b2b); }
    code { font: .88em ui-monospace, Menlo, monospace; }
    :not(pre) > code { background: light-dark(#f1f1f1, #333); padding: .1em .3em; border-radius: 4px; }
    blockquote { margin-inline: 0; padding-inline-start: 1em; border-inline-start: 3px solid #999; color: light-dark(#555, #bbb); }
    table { border-collapse: collapse; max-width: 100%; display: block; overflow: auto; }
    th, td { border: 1px solid #8886; padding: 6px 12px; }
    .link { color: light-dark(#1671c5, #80baff); text-decoration: underline; }
    img { max-width: 100%; height: auto; } hr { border: 0; border-top: 1px solid #8886; }
    .attachment { color: light-dark(#666, #aaa); font-style: italic; }
    @supports not (color: light-dark(white, black)) {
      body { color: #242424; background: white; }
      @media (prefers-color-scheme: dark) { body { color: #ececec; background: #202020; } }
    }
  </style>
</head>
<body><!--SCRIBE_CONTENT--></body>
</html>
